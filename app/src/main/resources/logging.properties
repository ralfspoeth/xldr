# Default java.util.logging configuration for the xldr application.
#
# slf4j-jdk14 routes everything HikariCP logs through slf4j into JUL, so this
# file configures the logging of the whole process.
#
# Main loads this bundled file only when neither java.util.logging.config.file
# nor java.util.logging.config.class is set, so a deployment overrides it with
#     -Djava.util.logging.config.file=/etc/xldr/logging.properties

handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n

com.pd.xldr.level = INFO

# raise to DEBUG/FINE to see pool sizing and leak detection
com.zaxxer.hikari.level = INFO
