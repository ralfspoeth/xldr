# xldr server configuration - sample.
#
# Copy it to the directory the server is started in, or to one named with
# --dir, under the name xldr.properties:
#
#   cp conf/xldr.properties /etc/xldr/ && bin/xldr --dir /etc/xldr

# feed roots (must exist at startup), separated by the platform path separator
xldr.roots = /var/lib/xldr

# seconds between full reconciliations; watch events react sooner
xldr.scanInterval = 30

# most files loaded at once, and with it the size of the connection pool:
# a load borrows one connection for one file
xldr.maxConcurrentLoads = 4

# target database - a driver for it must be in lib/
jdbc.url = jdbc:postgresql://localhost:5432/xldr
jdbc.user = xldr
jdbc.password =

# HikariCP: every pool.* key is passed through to HikariConfig. maximumPoolSize
# follows xldr.maxConcurrentLoads unless set here.
#pool.connectionTimeout = 30000
