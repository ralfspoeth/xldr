# xldr server configuration - sample.
#
# Copy it to the directory the server is started in, or to one named with
# --dir, under the name xldr.properties:
#
#   cp conf/xldr.properties /etc/xldr/ && bin/xldr --dir /etc/xldr
#
# Every key below is explained in README.md at the root of this distribution.
# If one of them does not behave as described there, that is a defect either way
# round: https://github.com/ralfspoeth/xldr/issues

# feed roots (must exist at startup), separated by the platform path separator
xldr.roots = /var/lib/xldr

# seconds between full reconciliations; watch events react sooner
xldr.scanInterval = 30

# most files loaded at once, and with it the size of the connection pool:
# a load borrows one connection for one file
xldr.maxConcurrentLoads = 4

# target database - the driver for this URL must be a jar in drivers/. Only H2
# ships, so every other database, this sample's PostgreSQL included, is one jar
# copied in first; see the README there.
#
# A path inside this URL belongs to the driver, not to xldr, and a relative one
# is resolved against the working directory of whoever started the process -
# which is not this file's directory, and is not something xldr can change:
# Java has no chdir. So make any path in here absolute. It bites with H2's
#   INIT=RUNSCRIPT FROM 'schema.sql'
# and equally with an Oracle wallet directory or a TLS trust store. The same
# goes the other way for xldr's own settings: a relative xldr.roots above IS
# resolved against this file, because that one is ours to resolve.
#
# Note also that a URL doing work on connect - INIT=RUNSCRIPT is the obvious
# case - makes `xldr check` write, however read-only the command itself is.
jdbc.url = jdbc:postgresql://localhost:5432/xldr
jdbc.user = xldr
jdbc.password =

# HikariCP: every pool.* key is passed through to HikariConfig. maximumPoolSize
# follows xldr.maxConcurrentLoads unless set here.
#pool.connectionTimeout = 30000
