# xldr server configuration - sample.
#
#   bin/xldr conf/xldr.properties

# feed roots (must exist at startup), separated by the platform path separator
xldr.roots = /var/lib/xldr

# seconds between full reconciliations; watch events react sooner
xldr.scanInterval = 30

# most files loaded at once; keep at or below pool.maximumPoolSize
xldr.maxConcurrentLoads = 4

# target database - a driver for it must be in lib/
jdbc.url = jdbc:postgresql://localhost:5432/xldr
jdbc.user = xldr
jdbc.password =

# HikariCP: every pool.* key is passed through to HikariConfig
pool.maximumPoolSize = 4
