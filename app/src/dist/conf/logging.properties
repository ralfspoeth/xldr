# java.util.logging configuration.
#
# This file is what the server uses unless the deployment supplies its own:
# a logging.properties beside its xldr.properties wins over this one, and
#   JAVA_OPTS=-Djava.util.logging.config.file=/etc/xldr/logging.properties bin/xldr
# wins over both.

handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n

io.github.ralfspoeth.xldr.level = INFO

# raise to FINE to see pool sizing and leak detection
com.zaxxer.hikari.level = INFO
