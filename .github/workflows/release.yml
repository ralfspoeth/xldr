name: release

# The tag is the trigger, and `mvn release:prepare` pushes it - so publishing a
# download stays part of releasing rather than a step to remember afterwards.
# The tag also fixes the version: release:prepare sets <revision> to the release
# version in the commit it tags, and only then bumps to the next snapshot.
on:
  push:
    tags: [ 'xldr-*' ]

permissions:
  # to create the release and attach the archives to it. Nothing else, and in
  # particular not write access to the repository's contents beyond that
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -DskipTests, because release:prepare ran clean verify against this exact
      # source before it cut the tag. Rebuilding is for producing the archives,
      # not for finding out whether they work.
      #
      # -pl app -am builds the application and what it needs, which leaves the
      # front ends and the integration tests out of it.
      - name: Build the distribution
        run: mvn -B -ntp -DskipTests package -pl app -am

      # A rename, and both formats from one unpacked tree so that the tarball and
      # the zip cannot come out holding different things. The assembly names its
      # output after the module that produced it while the archive unpacks to
      # xldr-<version>/, so a download called app-… would be the one name a
      # reader has met nowhere else.
      #
      # Nothing is taken out any more. Until 0.40 this step also deleted the
      # Oracle driver, which the build shipped as a convenience and which made
      # publishing it an act of redistribution - so the download and a local
      # build differed in one respect that had to be explained wherever either
      # was described. The driver is out of the build instead, which is the
      # version of that decision that needs no explaining: what you download is
      # what you would have built.
      - name: Repack under the name it unpacks to
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#xldr-}"
          built="app/target/app-$version-dist.tar.gz"
          test -f "$built" || { echo "::error::no $built - has the assembly changed?"; exit 1; }

          tar xzf "$built"
          root="xldr-$version"
          test -d "$root/drivers" || { echo "::error::no $root/drivers in the archive"; exit 1; }

          # the licence gate, so that a driver added to the assembly by accident
          # is caught here rather than by whoever receives the archive
          if ls "$root"/drivers/ojdbc*.jar >/dev/null 2>&1; then
            echo "::error::an Oracle driver is in the archive; it is not ours to publish"
            exit 1
          fi

          mkdir dist
          tar czf "dist/xldr-$version-dist.tar.gz" "$root"
          zip -qr "dist/xldr-$version-dist.zip" "$root"
          echo "published archive holds:"
          ls -l "$root/drivers"
          ls -l dist

      # gh is on the runner already, so this needs no third-party action and no
      # token beyond the one the job is given
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#xldr-}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "XLDR $version" \
            --notes "Unpack either archive and run \`bin/xldr\` - Java 25 or later, no build required.
          Carries JDBC drivers for H2 and PostgreSQL; any other database is its driver jar dropped into
          \`drivers/\` (see the README in that directory).
          See [the changelog](https://github.com/ralfspoeth/xldr/blob/$GITHUB_REF_NAME/CHANGELOG.md) for what
          changed in $version, and [the tutorial](https://github.com/ralfspoeth/xldr/blob/$GITHUB_REF_NAME/docs/tutorial/README.md)
          for writing the mapping spec that does the work.

          The library modules are on Maven Central under \`io.github.ralfspoeth.xldr\`; this archive is the server."
