name: build

on:
  push:
    branches: [ master ]
  pull_request:
  # so a broken dependency or a JDK update is noticed before a release does
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify, not test: the integration tests run at integration-test, and
      # signing stays out of the way - the gpg plugin is only in the release
      # profile, so no key or passphrase is needed here
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/*-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7
