# The database behind the DataSource Spring builds and the servlet is handed.
# In a real deployment this is a pooled connection to something durable; an
# in-memory H2 is what lets the sample run with nothing installed.
spring.datasource.url=jdbc:h2:mem:sample;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# the table the spec loads into, created at startup
spring.sql.init.mode=always
