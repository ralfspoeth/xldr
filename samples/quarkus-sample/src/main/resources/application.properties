# The DataSource Quarkus builds and the servlet is handed by injection. In a
# real deployment this is a pooled connection to something durable; an
# in-memory H2 is what lets the sample run with nothing installed.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:sample;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# The table the spec loads into is created by Schema.java rather than from here.
# It was an INIT clause on the URL above, which is how the Jetty sample does it -
# but that puts DDL inside a connection string, where a comma is ambiguous to
# config parsing and the statement is invisible to anyone reading the code. A
# startup observer is three more lines and says what it does.
