<svg width="680" height="500" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>xldr module dependency graph</title>
<desc>Nine xldr modules in five layers. Solid arrows point from a module down to what it requires: app to server and, around the left, to ldr; server and xlet to ldr; ldr and tck to ia; ia to spec. The five input adapters attach to ia by a dashed edge, bound at runtime by ServiceLoader rather than by a compile-time dependency.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
</defs>

<rect x="60" y="46" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="145" y="65" text-anchor="middle" dominant-baseline="central" fill="#085041">app</text>
<text class="ts" x="145" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">cli, pool, logging</text>

<rect x="60" y="134" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="145" y="153" text-anchor="middle" dominant-baseline="central" fill="#085041">server</text>
<text class="ts" x="145" y="172" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">watches and loads</text>

<rect x="260" y="134" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="345" y="153" text-anchor="middle" dominant-baseline="central" fill="#085041">xlet</text>
<text class="ts" x="345" y="172" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">one load per request</text>

<rect x="150" y="222" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="235" y="241" text-anchor="middle" dominant-baseline="central" fill="#085041">ldr</text>
<text class="ts" x="235" y="260" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">spec into insert</text>

<rect x="380" y="222" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="455" y="241" text-anchor="middle" dominant-baseline="central" fill="#444441">tck</text>
<text class="ts" x="455" y="260" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">the SPI as tests</text>

<rect x="150" y="310" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="235" y="329" text-anchor="middle" dominant-baseline="central" fill="#3C3489">ia</text>
<text class="ts" x="235" y="348" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the adapter SPI</text>

<rect x="410" y="310" width="210" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="515" y="329" text-anchor="middle" dominant-baseline="central" fill="#712B13">five input adapters</text>
<text class="ts" x="515" y="348" text-anchor="middle" dominant-baseline="central" fill="#993C1D">csv, flt, json, xml, xlsx</text>

<rect x="150" y="398" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="235" y="417" text-anchor="middle" dominant-baseline="central" fill="#3C3489">spec</text>
<text class="ts" x="235" y="436" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the mapping model</text>

<line x1="145" y1="102" x2="145" y2="128" class="arr" marker-end="url(#arrow)"/>
<path d="M 60 74 L 44 74 L 44 250 L 140 250" class="arr" marker-end="url(#arrow)"/>
<line x1="145" y1="190" x2="200" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="190" x2="285" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="278" x2="235" y2="304" class="arr" marker-end="url(#arrow)"/>
<line x1="455" y1="278" x2="310" y2="304" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="366" x2="235" y2="392" class="arr" marker-end="url(#arrow)"/>
<line x1="404" y1="338" x2="330" y2="338" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<line x1="150" y1="482" x2="180" y2="482" class="arr"/>
<text class="ts" x="190" y="482" dominant-baseline="central" fill="#888780">requires</text>
<line x1="270" y1="482" x2="300" y2="482" class="arr" stroke-dasharray="5 4"/>
<text class="ts" x="310" y="482" dominant-baseline="central" fill="#888780">bound at runtime by ServiceLoader</text>
</svg>
